<title>Histórico Fantasy Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: ballpark program. Sticky scoreboard bar with tabs; content column max 1100px; cards only for stat tiles and brackets. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#13233A; --muted:#5A6A7E; --line:#D8DFE8; --soft:#E8EDF3;
  --red:#C0392B; --blue:#1C6FB0; --gold:#A87400; --goldbg:#FBF1D9; --silver:#6B7785; --bronze:#9A5B2E;
  --good:#1E7A46; --bad:#B03A2E;
  --display:"Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --head:"Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --body:"Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162131; --ink:#E6ECF3; --muted:#94A3B6; --line:#2A384B; --soft:#1D2A3C;
  --red:#E0503F; --blue:#3F97E0; --gold:#E3B54B; --goldbg:#2E2716; --silver:#A9B4C1; --bronze:#D08A57;
  --good:#4CC284; --bad:#F07A6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162131; --ink:#E6ECF3; --muted:#94A3B6; --line:#2A384B; --soft:#1D2A3C;
  --red:#E0503F; --blue:#3F97E0; --gold:#E3B54B; --goldbg:#2E2716; --silver:#A9B4C1; --bronze:#D08A57;
  --good:#4CC284; --bad:#F07A6C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.5;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:1.6rem}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ink);color:var(--bg)}
.bar-in{max-width:1100px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.mark{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:10px}
.mark svg{flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:6px 12px;border-radius:999px;font-family:var(--head);font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:inherit;opacity:.75}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.lang{margin-left:auto;display:flex;border:1px solid currentColor;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;padding:3px 11px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:.9rem;letter-spacing:.05em;opacity:.8}
.lang button[aria-pressed="true"]{background:var(--bg);color:var(--ink);opacity:1}
.lang+.who{margin-left:0}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.9rem}
.who button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 10px;cursor:pointer;opacity:.85;font-size:.85rem}

section[role="tabpanel"]{display:grid;gap:28px}
.lnbox{grid-template-columns:minmax(0,1fr);min-width:0;max-width:100%}.lnbox select{max-width:100%;min-width:0}.lnbox .controls{flex-wrap:wrap}
section[role="tabpanel"]>*{min-width:0}
.row{display:grid;gap:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.block{display:grid;gap:12px;min-width:0}
.sub{color:var(--muted);font-size:.92rem;margin:0;max-width:65ch}

/* login */
.login{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:16px}
.login h2{font-size:2rem}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:500}
.pick button:hover{border-color:var(--ink)}
.pick .t{font-size:.8rem;color:var(--gold);font-weight:600;white-space:nowrap}
.note{font-size:.82rem;color:var(--muted)}

/* profile header */
.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:14px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,5vw,3rem)}
.hero .meta{color:var(--muted);font-size:.95rem}
.trophies{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-family:var(--head);font-weight:600;font-size:.95rem;letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.gold{background:var(--goldbg);border-color:var(--gold);color:var(--gold)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

.tg{margin:10px 0 8px;line-height:1.2;position:relative;z-index:1;font-family:var(--head);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--head);font-size:clamp(1.55rem,5.5vw,2rem);white-space:nowrap;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v.nm{white-space:normal;overflow-wrap:anywhere;font-size:clamp(1.3rem,4.6vw,1.7rem)}
.fa18{background:rgba(234,179,8,.20)}.fa19{border-left:2px solid var(--ink)}.th.fa18,th.fa18{background:rgba(234,179,8,.28)}
.lim{display:block;font-size:.62rem;font-weight:600;letter-spacing:.02em;text-transform:none;white-space:nowrap;opacity:.85}
.fakey{display:inline-block;width:.9em;height:.9em;border-radius:3px;background:rgba(234,179,8,.35);vertical-align:-.1em}
.field{position:relative;width:100%;max-width:640px;margin:10px auto 0;aspect-ratio:1/1.02;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.fp{position:absolute;transform:translate(-50%,-50%);width:clamp(74px,19%,120px);display:grid;justify-items:center;text-align:center;gap:1px;background:rgba(255,255,255,.92);color:#10213a;border-radius:9px;padding:4px 3px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.fp .pl{font-size:.58rem;font-weight:700;letter-spacing:.08em;color:#52607a}
.fp .pn{font-size:.7rem;font-weight:700;line-height:1.1}
.fp .pv{font-family:var(--head);font-size:1.15rem;font-weight:700;line-height:1}
.fp .pv.up{color:#1a7f37}.fp .pv.dn{color:#b3261e}
.tbl b.up{color:#1a7f37}.tbl b.dn{color:#b3261e}
.fp .pm{font-size:.55rem;color:#52607a;line-height:1.15}
.fp.none{background:rgba(255,255,255,.6);box-shadow:none}
.nouc{text-transform:none}
.tile .s{font-size:.82rem;color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--head);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th[aria-sort="descending"]::after{content:" ▾"}
th[aria-sort="ascending"]::after{content:" ▴"}
td.r,th.r{text-align:right}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--soft)}
tr.me td{background:var(--goldbg)}
.wrapname{white-space:normal;min-width:160px}
.fin{font-family:var(--head);font-weight:600;letter-spacing:.03em}
.f1{color:var(--gold)} .f2{color:var(--silver)} .f3{color:var(--bronze)} .fq{color:var(--blue)} .fn{color:var(--muted)}
.w{color:var(--good);font-weight:600} .l{color:var(--bad);font-weight:600}

/* chart */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);padding:0 4px 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}

/* champions wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.yr b{font-family:var(--head);font-size:1.3rem}
.yr .c{color:var(--gold);font-weight:600}
.yr .o{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.yr .tn{font-style:italic;font-size:.9rem}
.yr .rs{font-family:var(--head);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}

/* bracket */
.seasons{display:flex;flex-wrap:wrap;gap:6px}
.seasons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:1rem}
.seasons button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.round{display:grid;gap:10px;align-content:space-around}
.round h3{align-self:start}
.game{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.game div{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.game div+div{border-top:1px solid var(--line)}
.game .win{font-weight:600}
.game .lose{color:var(--muted)}
.game .mine{box-shadow:inset 3px 0 0 var(--red)}
.game .sc{font-family:var(--head);font-weight:700;font-size:1.05rem}

/* records */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.rec ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.rec li{padding-left:2px}
.rec .big{font-family:var(--head);font-weight:700;font-size:1.1rem}
.rec .d{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 40px;position:relative;line-height:1.45}
.facts li::before{content:"★";position:absolute;left:14px;top:11px;color:var(--gold);font-size:1.05rem}
.nick{font-family:var(--display);font-size:.95em;color:var(--red);white-space:nowrap}
.seed{display:inline-block;min-width:2.1em;text-align:center;border-radius:6px;padding:0 6px;font-family:var(--head);font-weight:700;background:var(--soft);border:1px solid var(--line)}
.seed.s1{background:var(--goldbg);border-color:var(--gold);color:var(--gold)}
.res{font-family:var(--head);font-weight:600;letter-spacing:.02em}
td.fn{color:var(--muted)}
.res.r4{color:var(--gold)} .res.r3{color:var(--silver)} .res.r2{color:var(--blue)} .res.r1{color:var(--bad)}
.regpair{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.hall .rec{border-width:2px}
.hall .cold{border-color:var(--blue)} .hall .clutch{border-color:var(--gold)}
.hall .ttl{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.ast{color:var(--red);font-weight:700;font-size:.8em;margin-left:1px;cursor:help}
.astnote{margin:0;font-size:.85rem;color:var(--muted);font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.controls .vs{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-family:var(--head);font-weight:600;font-size:1rem;letter-spacing:.03em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.duel .side{display:grid;gap:2px}
.duel .side.r{text-align:right}
.duel .nm{font-family:var(--display);font-size:clamp(1.1rem,3.5vw,1.6rem);line-height:1.1}
.duel .big{font-family:var(--head);font-weight:700;font-size:clamp(2rem,7vw,3rem);line-height:1;font-variant-numeric:tabular-nums}
.duel .mid{text-align:center;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
.duel .lead{color:var(--good)}
@media (max-width:560px){.duel{grid-template-columns:1fr 1fr}.duel .mid{grid-column:1/-1;order:-1}}
.mtab{display:grid;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,1.2fr) minmax(0,2fr);gap:4px 16px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:hover{background:var(--soft)}
.mrow.me{background:var(--goldbg)}
.mname{font-family:var(--head);font-weight:700;font-size:1.1rem}
.mm.sm{font-size:.9rem;letter-spacing:.02em;margin-left:6px;white-space:nowrap;min-height:0}
.mm{font-size:1.25rem;letter-spacing:.06em;line-height:1.2;min-height:1.2em}
@media (max-width:640px){.mrow{grid-template-columns:1fr auto}.mrow .d{grid-column:1/-1}}
@media (max-width:640px){.bar{position:static}.tab{padding:5px 9px;font-size:.95rem}.who{margin-left:0}.lang{margin-left:auto}}
@media (prefers-reduced-motion:no-preference){.tile,.game,.yr{transition:border-color .15s}}

/* movements */
.trades{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.trade .th{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:9px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-family:var(--head);font-weight:600;letter-spacing:.02em}
.trade .td{font-size:1.05rem}
.verdict{font-size:1.05rem;color:var(--gold)}
.verdict b{font-variant-numeric:tabular-nums}
.verdict.even{color:var(--muted)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.side{padding:10px 12px;display:grid;gap:4px;align-content:start;min-width:0}
.side+.side{border-left:1px solid var(--line)}
.side.won{box-shadow:inset 3px 0 0 var(--gold);background:var(--goldbg)}
.so{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.so .sp{font-family:var(--head);font-variant-numeric:tabular-nums;white-space:nowrap}
.got{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.92rem}
.side li{display:flex;justify-content:space-between;gap:8px}
.side li .d{font-variant-numeric:tabular-nums}
.seasons .d{opacity:.7;font-size:.85em;margin-left:2px}
@media (max-width:640px){.side+.side{border-left:0;border-top:1px solid var(--line)}}

/* years */
table.years td{vertical-align:top;min-width:120px}
table.years td.yn{font-family:var(--head);font-weight:700;font-size:1.1rem;min-width:56px}
table.years td.pd div{white-space:nowrap}
table.years tr.yrow td{border-bottom:0;padding-bottom:4px}
table.years tr.st td{font-size:.88rem;color:var(--muted);padding-top:0;padding-bottom:14px}
table.years .sty{white-space:normal;width:min(760px,calc(100vw - 64px));position:sticky;left:12px;max-width:min(760px,calc(100vw - 64px))}
table.years .awl{display:flex;gap:6px;margin-bottom:6px}
table.years .lg{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-top:2px;min-width:18px}
table.years .aw{display:grid;gap:1px;min-width:0}
table.years .aw .d{font-size:.78rem;color:var(--muted)}
tr.early td{color:var(--muted)}

.hang{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 16px;padding:18px 12px 22px;margin-bottom:12px;border-radius:12px;background:linear-gradient(var(--soft),var(--surface));border:1px solid var(--line)}
.ban{margin:0;position:relative;padding-top:14px;transform-origin:50% 0;transform:rotate(var(--r,0deg));transition:transform .5s ease}
.ban:hover{transform:rotate(0deg) translateY(-2px)}
.ban .rod{position:absolute;top:0;left:-7px;right:-7px;height:9px;border-radius:5px;background:linear-gradient(#b08a52,#6f5530);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.ban .rod::before,.ban .rod::after{content:"";position:absolute;top:-2px;width:9px;height:13px;border-radius:50%;background:#8a6a3a}
.ban .rod::before{left:-4px}.ban .rod::after{right:-4px}
.ban img{display:block;height:250px;width:auto;max-width:100%;filter:drop-shadow(0 7px 7px rgba(0,0,0,.4))}
@media (max-width:640px){.ban img{height:220px}}

.yr .ln{font-size:.78rem;color:var(--muted);font-style:italic}
.case{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:flex-end;align-items:flex-end}
.hero>.block{max-width:100%;min-width:0}
.case{max-width:100%}
.cs{display:grid;justify-items:center;line-height:1}
.cs .ic{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.cs.c1 .ic{font-size:3.4rem}.cs.c2 .ic,.cs.c3 .ic{font-size:2.3rem}
.cs .yy{font-family:var(--head);font-weight:600;font-size:.8rem;margin-top:3px}
.cs.c1 .yy{color:var(--gold)}

.themed .hero{position:relative;overflow:hidden;border-radius:14px;padding:18px 20px;background:var(--hbg);border-bottom:5px solid var(--ml);color:var(--mi)}
.themed .hero::before{content:"";position:absolute;inset:0;background-image:var(--pat);opacity:.22;pointer-events:none}
.themed .hero .block{position:relative;z-index:1}
.themed .hero h1,.themed .hero .meta,.themed .hero .note{color:var(--mi)}
.themed .hero h1{text-shadow:none}
.themed .chip{color:#0C2340}
.themed .hero .note{background:rgba(0,0,0,.38);color:#fff;border-radius:8px;padding:3px 8px}
.themed .tile{border-top:4px solid var(--ml)}
.themed .cs .yy{color:var(--mi);background:rgba(0,0,0,.28);border-radius:8px;padding:1px 6px}
.themed .hero[data-w] .cs .yy{color:#fff}
.themed h3{border-left:4px solid var(--ml);padding-left:8px}

.lnwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.lnteam{min-width:0}
.lnh{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;background:var(--soft);border:1px solid var(--line);border-radius:10px 10px 0 0;border-bottom:0}
.lnh .lns{font-family:var(--head);font-size:1.4rem;font-weight:700}
.lnteam .tbl{border-radius:0 0 10px 10px}

});

  const my = games.filter(g => g.a === o || g.b === o);

  return {o, rows, seasons: rows.length, first: rows[0]?.s, W, L, T, wp: W+L+T ? (W+T/2)/(W+L+T) : null,

const heartbreaks = [];

  const [a,b,l,ink,pat] = th;
  const bg = pat==='pinstripes' ? `repeating-linear-gradient(90deg,transparent 0 11px,rgba(212,160,23,.35) 11px 12px),linear-gradient(#0A1F44,#0A1F44)` : o==='Rolando Curiel' ? `linear-gradient(100deg,#012169 0,#012169 46%,#E4002B 46.2%,#E4002B 70%,#00843D 70.2%,#00843D 100%)` : pat==='stripes' ? `linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),repeating-linear-gradient(90deg,#74ACDF 0 30px,#fff 30px 60px)` : `linear-gradient(100deg,${a} 0,${a} 56%,${b} 56.2%,${b} 100%)`;

  return `<div class="themed" style="--ma:${a};--mb:${b};--ml:${l};--mi:${ink};--hbg:${bg};--pat:${pu}">${cardView0(o)}</div>`;

function ppgChart(o){
  const el = $('#ppgchart'); if (!el) return;
  const pts = SUM[o].rows.filter(h=>ppg(h)!=null).map(h=>({s:h.s, v:ppg(h), a:leagueAvg[h.s]}));
  if (pts.length < 2){ el.innerHTML = '<p class="empty" style="margin:8px">Not enough scored seasons to chart.</p>'; return; }
  const yrs = seasons.filter(s=>leagueAvg[s]!=null);
  const W = 720, Hh = 240, m = {l:40,r:18,t:14,b:28};
  const all = pts.flatMap(p=>[p.v,p.a]).concat(yrs.map(s=>leagueAvg[s]));
  let lo = Math.floor(Math.min(...all)/10)*10, hi = Math.ceil(Math.max(...all)/10)*10;
  const x = s => m.l + (yrs.indexOf(s))/(yrs.length-1)*(W-m.l-m.r);
  const y = v => m.t + (hi-v)/(hi-lo)*(Hh-m.t-m.b);
  const ticks = []; for (let v=lo; v<=hi; v+=(hi-lo)>60?20:10) ticks.push(v);
  const line = arr => arr.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const last = pts.at(-1);
  el.innerHTML = `<div class="legend"><span><i class="sw" style="background:var(--ml,var(--red))"></i>${esc(o)}</span><span><i class="sw" style="background:var(--blue)"></i>League average</span></div>
  <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${T(`Points per match by season for ${esc(o)} compared with the league average`,`Puntos por match por temporada de ${esc(o)} comparado con el promedio de la liga`)}">
    ${ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    ${yrs.map(s=>`<text x="${x(s)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--muted)">'${String(s).slice(2)}</text>`).join('')}
    <path d="${line(yrs.map(s=>[s,leagueAvg[s]]))}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line(pts.map(p=>[p.s,p.v]))}" fill="none" stroke="var(--ml,var(--red))" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${x(p.s)}" cy="${y(p.v)}" r="4" fill="var(--ml,var(--red))" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    <text x="${Math.min(x(last.s), W-m.r)}" y="${y(last.v)-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${fmt(last.v)}</text>
    ${yrs.map(s=>`<rect data-s="${s}" x="${x(s)-(W-m.l-m.r)/(yrs.length-1)/2}" y="${m.t}" width="${(W-m.l-m.r)/(yrs.length-1)}" height="${Hh-m.t-m.b}" fill="transparent"/>`).join('')}
  </svg><div class="tip" hidden></div>`;
  const tip = $('.tip', el), svg = $('svg', el);
  svg.querySelectorAll('rect[data-s]').forEach(r => {
    r.addEventListener('mouseenter', () => {
      const s = +r.dataset.s, p = pts.find(q=>q.s===s), bb = svg.getBoundingClientRect(), eb = el.getBoundingClientRect();
      const px = x(s)/W*bb.width + (bb.left-eb.left), py = y(p ? p.v : leagueAvg[s])/Hh*bb.height + (bb.top-eb.top);
      tip.innerHTML = `<b>${s}</b>${s===2020?T(' (short season)',' (temporada corta)'):''}<br>${esc(o)}: ${p?fmt(p.v):T('did not play','no jugó')}<br>${T('League avg','Promedio liga')}: ${fmt(leagueAvg[s])}`;
      tip.style.left = Math.max(70, Math.min(px, eb.width-70))+'px'; tip.style.top = py+'px'; tip.hidden = false;
    });
    r.addEventListener('mouseleave', () => tip.hidden = true);
  });

const RUNS = (() => {
  const RO = {Quarterfinal:1, Semifinal:2, 'Third Place':3, Final:3};
  const seq = {};
  const add = (s,o,x) => (seq[s+'|'+o] ??= {s,o,g:[]}).g.push(x);
  R.forEach(r => { const a=O[r[2]], b=O[r[4]]; const ra = r[6]==='t'?'T':r[6]==='a'?'W':'L', rb = ra==='T'?'T':ra==='W'?'L':'W';
    add(r[0],a,{k:r[1],res:ra,po:false,lab:'week '+r[1]}); add(r[0],b,{k:r[1],res:rb,po:false,lab:'week '+r[1]}); });
  games.forEach(g => { if (g.s<2015 || g.b==='Unknown') return; const k=100+RO[g.r], lab=g.r.toLowerCase();
    add(g.s,g.a,{k,res:g.win===g.a?'W':'L',po:true,lab}); add(g.s,g.b,{k,res:g.win===g.b?'W':'L',po:true,lab}); });
  const list = Object.values(seq); list.forEach(x=>x.g.sort((a,b)=>a.k-b.k));
  const hist = Object.fromEntries(H.map(h=>[h.s+'|'+h.o,h]));
  const comebacks = [], chokes = [];
  list.forEach(x => {
    const reg = x.g.filter(g=>!g.po); let w=0,l=0,lo={m:0},hi={m:-99},pk={m:0,w:0,l:0,k:0},dd={d:0}; const h = hist[x.s+'|'+x.o]; if (!h) return;
    reg.forEach((g,i) => { if (g.res==='W') w++; if (g.res==='L') l++; const m=w-l;
      if (m<lo.m) lo={m,w,l,k:g.k}; if (i>=5 && m>hi.m) hi={m,w,l,k:g.k};
      if (m>pk.m) pk={m,w,l,k:g.k}; if (pk.m>=3 && pk.m-m>dd.d) dd={d:pk.m-m, pk:{...pk}, tr:{w,l,k:g.k}}; });
    const fm = h.w - h.l; const r = {s:x.s,o:x.o,h,fm};
    if (h.p && lo.m<=-3) comebacks.push({...r, lo, rise: fm-lo.m});
    if (hi.m>=3 && !h.p) chokes.push({...r, hi, drop: hi.m-fm, missed: true});
    if (h.p && dd.d>=4) chokes.push({...r, dd, missed: false});
  });
  comebacks.sort((a,b)=>b.rise-a.rise || a.lo.m-b.lo.m);
  const missed = chokes.filter(c=>c.missed).sort((a,b)=>b.drop-a.drop || b.hi.m-a.hi.m);
  const almost = chokes.filter(c=>!c.missed).sort((a,b)=>b.dd.d-a.dd.d || b.s-a.s);
  // streaks
  const runs = (arr, ch) => { let best={n:0}, cur=null; arr.forEach((g,i)=>{ if (g.res===ch){ cur = cur ? {...cur,n:cur.n+1,end:g} : {n:1,start:g,end:g}; if (cur.n>best.n) best=cur; } else cur=null; }); return best; };
  const seasonW = list.map(x=>({s:x.s,o:x.o,...runs(x.g,'W')})).sort((a,b)=>b.n-a.n||b.s-a.s);
  const seasonL = list.map(x=>({s:x.s,o:x.o,...runs(x.g.filter(g=>!g.po),'L'), games:x.g.filter(g=>!g.po).length}));
  const byO = {}; list.slice().sort((a,b)=>a.s-b.s).forEach(x => x.g.forEach(g => (byO[x.o] ??= []).push({...g, s:x.s})));
  const mgr = Object.entries(byO).map(([o,arr])=>({o, w:runs(arr,'W'), l:runs(arr,'L'), n:arr.length}));
  return {comebacks, missed, almost, seasonW, seasonL, mgr};
})();

  const wlRows = wl.map(r=>{const g=r.w+r.l+r.t; return `<tr class="link${r.o===me?' me':''}" data-open="${esc(r.o)}"><td>${esc(r.o)}</td><td class="r">${r.n}</td><td class="r">${g?`${r.w}–${r.l}${r.t?'–'+r.t:''}`:'—'}</td><td class="r">${g?pct(r.w/g):'—'}</td><td class="r"><span class="${r.m>0?'w':r.m<0?'l':''}">${g?(r.m>0?'+':'')+fmt(r.m):'—'}</span></td></tr>`;}).join('');

  const faTot = {}; fy.forEach(y=>{ const d=MV.fa[y]; new Set([...Object.keys(d.fa),...Object.keys(d.wv)]).forEach(o=>{ faTot[o] = faTot[o]||{}; faTot[o][y] = (d.fa[o]||0)+(d.wv[o]||0); }); });
  const faOwners = Object.keys(faTot).sort((a,b)=>sum(Object.values(faTot[b]))-sum(Object.values(faTot[a])));
  const faYearTot = Object.fromEntries(fy.map(y=>[y, sum(faOwners.map(o=>faTot[o][y]||0))]));
  const faMax = Object.fromEntries(fy.map(y=>[y, Math.max(...faOwners.map(o=>faTot[o][y]||0))]));
  const faAll = sum(Object.values(faYearTot)), faBig = faOwners.flatMap(o=>fy.map(y=>({o,y,n:faTot[o][y]||0}))).sort((a,b)=>b.n-a.n)[0];
  const faBusy = Object.entries(faYearTot).sort((a,b)=>b[1]-a[1])[0];

  /* draft reliance */

  const rOwners = [...new Set(ry.flatMap(y=>Object.keys(MV.rel[y])))];

  const cells = ry.flatMap(y=>Object.entries(MV.rel[y]).map(([o,v])=>({o,y,p:v[0]/v[1],v})));
  const rHi = cells.slice().sort((a,b)=>b.p-a.p)[0], rLo = cells.slice().sort((a,b)=>a.p-b.p)[0];
  const rMax = Object.fromEntries(ry.map(y=>[y, Math.max(...Object.values(MV.rel[y]).map(v=>v[0]/v[1]))]));

  const yrs = a => a.join(', ');
  const ownedLi = r => `<li><span class="big">${r.n} ${T('seasons','temporadas')}</span> · ${esc(r.p)} · ${esc(r.o)}<br><span class="d">${yrs(r.yrs)}</span></li>`;
  const tenLi = r => `<li><span class="big">${r.st} ${T('in a row','seguidas')}</span> · ${esc(r.p)} · ${esc(r.o)}<br><span class="d">${r.from} – ${r.to}</span></li>`;
  const tenRows = MV.tenureTeam.map(r=>`<tr class="link${r.o===me?' me':''}" data-open="${esc(r.o)}"><td>${esc(r.o)}</td><td>${esc(r.p)}<br><span class="d">${r.from===r.to?r.from:r.from+' – '+r.to}</span></td><td class="r">${r.st}</td></tr>`).join('');

  return `<div class="block"><h2>${T('Movements','Movimientos')}</h2><p class="sub">${T('Trades, free agent pickups, the draft and who holds on to players the longest. Transaction data starts in 2018, because ESPN keeps no transaction log for 2015 to 2017.','Cambios, agentes libres, el draft y quién se queda con sus jugadores por más tiempo. Los datos de transacciones empiezan en 2018, porque ESPN no guarda registro de transacciones de 2015 a 2017.')}</p></div>

  <!--S:trades--><div class="block"><h2>${T('Trades','Cambios')}</h2>
    <p class="sub">${T(`Points the players each side received scored in the starting lineup, from the first matchup after the trade to the end of that season (playoffs included), for as long as that manager kept the player. The matchup in which the trade happened is skipped. Bench and IL days don't count. The difference is a snapshot of the points, not a verdict on who won.`,`Puntos que anotaron como titulares los jugadores que recibió cada lado, desde el primer matchup después del cambio hasta el final de esa temporada (playoffs incluidos), mientras ese manager conservó al jugador. El matchup en que se hizo el cambio no se cuenta. Los días en banca y en IL no cuentan. La diferencia es una foto de los puntos, no un veredicto de quién ganó.`)}</p>
    <div class="tiles">
      <div class="tile"><span class="k">${T('Trades on record','Cambios registrados')}</span><span class="v">${all.length}</span><span class="s">${mvSeasons[0]} – ${mvSeasons.at(-1)}</span></div>
      <div class="tile"><span class="k">${T('Busiest year','Año más activo')}</span><span class="v">${busiest[0]}</span><span class="s">${busiest[1]} ${T('trades','cambios')}</span></div>

    <div class="rec"><h3>${T('Most traded players','Jugadores más cambiados')}</h3><span class="d">${T('Times moved between managers','Veces que cambiaron de manager')}</span><ol>${moved}</ol></div>

  <!--S:fa--><div class="block"><h2>${T('Free agency','Agentes libres')}</h2>
    <p class="sub">${T('Players added from free agency or waivers, per manager and season. Bold marks the most in that season.','Jugadores agregados desde agentes libres o waivers, por manager y temporada. La negrita marca al que más agregó en esa temporada.')}</p>
    <div class="tiles">
      <div class="tile"><span class="k">${T('Pickups on record','Pickups registrados')}</span><span class="v">${fmt(faAll,0)}</span><span class="s">${fy[0]} – ${fy.at(-1)}</span></div>
      <div class="tile"><span class="k">${T('Busiest season','Temporada más activa')}</span><span class="v">${faBusy[0]}</span><span class="s">${fmt(faBusy[1],0)} ${T('pickups','pickups')}</span></div>
      <div class="tile"><span class="k">${T('Most in one season','Más en una temporada')}</span><span class="v">${fmt(faBig.n,0)}</span><span class="s">${esc(faBig.o)} · ${faBig.y}</span></div>
    </div>
    <div class="tbl"><table><thead><tr><th>${T('Manager','Manager')}</th>${fy.map(y=>`<th class="r${y==='2018'?' fa18':''}${y==='2019'?' fa19':''}">${y}${y==='2018'?`<span class="lim">${T('No limit','Sin límite')}</span>`:y==='2019'?`<span class="lim">${T('7 per match','7 por match')}</span>`:''}</th>`).join('')}<th class="r">${T('Total','Total')}</th></tr></thead><tbody>
      ${faOwners.map(o=>`<tr class="link${o===me?' me':''}" data-open="${esc(o)}"><td>${esc(o)}</td>${fy.map(y=>{const n=faTot[o][y]; return `<td class="r num${y==='2018'?' fa18':''}${y==='2019'?' fa19':''}">${n==null?'—':(n===faMax[y]?`<b>${fmt(n,0)}</b>`:fmt(n,0))}</td>`;}).join('')}<td class="r num"><b>${fmt(sum(Object.values(faTot[o])),0)}</b></td></tr>`).join('')}
      <tr><td><b>${T('League','Liga')}</b></td>${fy.map(y=>`<td class="r num${y==='2018'?' fa18':''}${y==='2019'?' fa19':''}">${fmt(faYearTot[y],0)}</td>`).join('')}<td class="r num"><b>${fmt(faAll,0)}</b></td></tr>

const awTxt = (w, y) => {
  const ev = w.ch.filter(e=>e[1]!=='O' || true).map(e=>{
    const [d,ty,o,rd,ov] = e, dt = d.endsWith('-00') ? '' : ' · ' + mdate(d);
    if (ty==='D') return T(`Drafted by ${o} (Rd ${rd}, #${ov})`, `Drafteado por ${o} (Ronda ${rd}, #${ov})`);
    if (ty==='O') return T(`Owned by ${o}`, `De ${o}`);
    if (ty==='T') return T(`Traded to ${o}${dt}`, `Cambiado a ${o}${dt}`);
    if (ty==='WAIVER') return T(`Waivers to ${o}${dt}`, `Waivers a ${o}${dt}`);
    return T(`Picked up by ${o}${dt}`, `Agregado por ${o}${dt}`);
  });
  if (ev.length>3) ev.splice(1, ev.length-2, T(`${ev.length-2} more moves`, `${ev.length-2} movimientos más`));
  const lastO = w.ch.length ? w.ch.at(-1)[2] : '';
  if (w.fin && w.fin !== lastO) ev.push(T(`Finished with ${w.fin}`, `Terminó con ${w.fin}`));
  if (!ev.length) ev.push(y<=2014 ? T('Not on record','Sin registro') : T('Not rostered','Sin equipo'));
  return `<div class="aw"><b>${esc(w.n)}</b><span class="d">${ev.map(esc).join('<br>')}</span></div>`;
};
const awCell = (pair, y) => pair.map((w,i)=>`<div class="awl"><span class="lg">${i?'NL':'AL'}</span>${awTxt(w,y)}</div>`).join('');
function yearsView(){
  const ys = Object.keys(YRD.YR).map(Number).sort((a,b)=>b-a);
  const rows = ys.map(y=>{
    const r = YRD.YR[y], a = YRD.AW[y], p = r.pod || {};
    const pod = [1,2,3].map(k=>p[k]?`<div>${['🥇','🥈','🥉'][k-1]} ${esc(p[k])}</div>`:'').join('') || '—';
    const pk = r.pick ? `<b>${esc(r.pick.p)}</b><br><span class="d">${esc(r.pick.o)}${r.pick.t?` · ${esc(r.pick.t)}`:''}</span>` : `<span class="d">${T('Not on record','Sin registro')}</span>`;
    const tba = `<span class="d">${T('To be announced in November','Se anuncia en noviembre')}</span>`;
    const c = k => a ? awCell(a[k], y) : tba;
    return `<tr class="yrow"><td class="yn">${y}</td><td><b>${esc(r.name)}</b></td><td class="pd">${pod}</td><td>${pk}</td><td>${c('cy')}</td><td>${c('roy')}</td><td>${c('mvp')}</td></tr>
    <tr class="st"><td colspan="7"><div class="sty">${esc(T(...STORY[y]))}</div></td></tr>`;
  }).join('');
  return `<div class="block"><h2>${T('Year by year','Año por año')}</h2>
    <p class="sub">${T('League name, podium, #1 draft pick, and the MLB award winners with who owned them and when they were drafted or acquired. 2012 to 2014 come from old ESPN emails, so draft and ownership details are partial.','Nombre de la liga, podio, pick #1 del draft y los ganadores de premios de MLB con quién los tuvo y cuándo los draftearon o adquirieron. 2012 a 2014 vienen de correos viejos de ESPN, así que los datos de draft y propiedad son parciales.')}</p>
    <div class="tbl"><table class="years"><thead><tr><th>${T('Year','Año')}</th><th>${T('League','Liga')}</th><th>${T('Podium','Podio')}</th><th>${T('#1 pick','Pick #1')}</th><th>${T('Cy Young','Cy Young')}</th><th>${T('Rookie of the Year','Novato del Año')}</th><th>MVP</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
function earlyView(){

  </div>`;
}

const secOf = (html, key) => { const m = html.split(/<!--S:(\w+)-->/); for (let i=1;i<m.length;i+=2) if (m[i]===key) return m[i+1]; return ''; };
const secHead = html => html.split(/<!--S:\w+-->/)[0];
const SUBS = {years:'year', move:'trades'};
const subnav = (tab, items) => `<div class="controls"><div class="seg" role="group">${items.map(([k,l])=>`<button type="button" data-sub="${tab}:${k}" aria-pressed="${SUBS[tab]===k}">${l}</button>`).join('')}</div></div>`;
function yearsTab(){
  const sec = {year:yearsView(), reg:regView(), early:earlyView()};
  if (!sec[SUBS.years]) SUBS.years = 'year';
  return subnav('years',[['year',T('Year by year','Año por año')],['reg',T('Regular season','Temporada regular')],['early',T('Early managers','Managers de los inicios')]]) + sec[SUBS.years];
}
function movesTab(){
  const h = movesView();
  const sec = {trades:secOf(h,'trades'), fa:secOf(h,'fa'), draft:secOf(h,'draft'), players:secOf(h,'players')+secOf(h,'ptables')};
  if (!sec[SUBS.move]) SUBS.move = 'trades';
  return secHead(h) + subnav('move',[['trades',T('Trades','Cambios')],['fa',T('Free agency','Agentes libres')],['draft',T('Draft','Draft')],['players',T('Players','Jugadores')]]) + sec[SUBS.move];
}

  if (t.dataset.regm){ regMode = t.dataset.regm; render(); return; }
  if (t.dataset.sub){ const [tb,k] = t.dataset.sub.split(':'); SUBS[tb] = k; render(); return; }
  if (t.dataset.recsec){ recSec = t.dataset.recsec; render(); return; }
  if (t.dataset.h2hf){ h2hF = t.dataset.h2hf; render(); return; }
  if (t.dataset.h2hb){ h2hB = t.dataset.h2hb; render(); return; }
  if (t.dataset.login) login(t.dataset.login);
  else if (t.dataset.open) openCard(t.dataset.open);
  else if (t.dataset.sort){ const k=t.dataset.sort; sortDir = sortKey===k ? -sortDir : (k==='o'?1:-1); sortKey=k; render(); }
  else if (t.dataset.year){ bracketYear = +t.dataset.year; render(); }
});
document.addEventListener('change', e => { if (e.target.id==='viewsel') openCard(e.target.value); if (e.target.id==='iwM'){ iwM = e.target.value; render(); }
  if (e.target.id==='iwtY'){ iwtY = e.target.value==='all'?'all':+e.target.value; render(); } if (e.target.id==='iwtT'){ iwtT = e.target.value; render(); } if (e.target.id==='iwY'){ iwY = e.target.value==='all'?'all':+e.target.value; render(); }
  if (e.target.id==='lnY'){ lnY = +e.target.value; lnM = null; render(); } if (e.target.id==='lnM'){ lnM = +e.target.value; render(); } if (e.target.id==='h2hA'){ h2hA = e.target.value; render(); } if (e.target.id==='h2hB'){ h2hB = e.target.value; render(); } });
setTab(tab); setLang(lang);
</script>
